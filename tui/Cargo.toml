[package]
name = "ironic-tui"
version = "0.1.0"
authors = ["meta <eigenform@users.noreply.github.com>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ironic-core = { path = "../core" }
ironic-backend = { path = "../back" }

clap = { version = "~4.6.1", features = ["std", "derive", "suggestions", "color", "wrap_help"]}
colored = { version = "~3.1.1" }
anyhow = { version = "~1.0.102", features = ["std", "backtrace"] }
log = { version = "~0.4.29", default-features = false, features = ["std"] }
env_logger = { version = "~0.11.11", default-features = false }
strum = { version = "~0.28.0", features = ["derive"] }
addr2line = { version = "~0.27.1", default-features = false, features = ["std"] }
gimli = "~0.34.0"
ctrlc = { version = "~3.5.2", features = ["termination"] }
parking_lot = { version = "~0.12.5", default-features = false, features = ["nightly", "hardware-lock-elision"] }
